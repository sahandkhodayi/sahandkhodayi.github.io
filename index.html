<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LARPSOCIETY — 12 DAYS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020403;color:#d9ffd9;font-family:"Courier New",monospace}body{overflow:hidden}.wall{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;filter:brightness(.34) saturate(.7)}.wall img{width:100%;height:100%;object-fit:cover}.network{position:fixed;inset:0;z-index:1;pointer-events:auto}.noise,.scan{position:fixed;inset:0;pointer-events:none}.noise{background:radial-gradient(circle at 50% 50%,transparent 15%,rgba(0,0,0,.62) 100%),linear-gradient(90deg,rgba(0,255,80,.035) 1px,transparent 1px);background-size:auto,4px 100%;mix-blend-mode:screen}.scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);opacity:.55}.center{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;pointer-events:none}.terminal{width:min(920px,94vw);border:1px solid rgba(119,255,128,.38);background:rgba(1,5,2,.78);box-shadow:0 0 60px rgba(0,255,70,.08),inset 0 0 80px rgba(0,255,70,.025);backdrop-filter:blur(5px);pointer-events:auto}.head{height:38px;border-bottom:1px solid rgba(119,255,128,.22);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;letter-spacing:.16em;color:#8dce91}.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#356b3b}.body{padding:42px 46px 48px}.prompt{color:#6dff79;font-size:13px}.title{margin:22px 0 8px;font-size:clamp(42px,8vw,92px);line-height:.9;letter-spacing:.08em;color:#a8ffad;text-shadow:0 0 18px rgba(91,255,108,.35);font-weight:700}.sub{color:#72b878;font-size:13px;letter-spacing:.14em}.rule{height:1px;background:rgba(119,255,128,.18);margin:30px 0}.label{font-size:11px;color:#6f9f73;letter-spacing:.18em}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.unit{border:1px solid rgba(119,255,128,.16);padding:17px 12px;background:rgba(0,20,4,.25)}.num{font-size:clamp(28px,5vw,55px);color:#d4ffd5;line-height:1}.unit small{display:block;margin-top:7px;color:#619b66;font-size:9px;letter-spacing:.16em}.launch{margin-top:30px;display:flex;justify-content:space-between;gap:20px;color:#6f9f73;font-size:10px;letter-spacing:.1em}.launch b{color:#a8ffad;font-weight:400}.blink{animation:blink 1.1s steps(2,end) infinite}@keyframes blink{50%{opacity:.25}}footer{margin-top:26px;color:#426a46;font-size:9px;display:flex;justify-content:space-between}@media(max-width:650px){.wall{grid-template-columns:1fr}.wall img:last-child{display:none}.body{padding:30px 22px 32px}.count{grid-template-columns:repeat(2,1fr)}.launch,footer{flex-direction:column}.title{font-size:44px}.terminal{width:96vw}}
</style>
</head><body>
<div class="wall" aria-hidden="true"><img src="media/countdown/photo-01.svg" alt=""><img src="media/countdown/photo-02.svg" alt=""></div>
<canvas class="network" id="network"></canvas><div class="noise"></div><div class="scan"></div>
<main class="center"><section class="terminal"><div class="head"><span class="dots"><i></i><i></i><i></i></span><span>LARPSOCIETY // PUBLIC NODE</span><span>BUILD 0.0.1</span></div><div class="body"><div><span class="prompt">larp@system:~$</span> ./release_countdown</div><h1 class="title">LARP<br>SOCIETY</h1><div class="sub">THE SOCIETY IS COMING ONLINE</div><div class="rule"></div><div class="label">TIME UNTIL PUBLIC RELEASE</div><div class="count" id="count"><div class="unit"><div class="num" id="days">12</div><small>DAYS</small></div><div class="unit"><div class="num" id="hours">00</div><small>HOURS</small></div><div class="unit"><div class="num" id="mins">00</div><small>MINUTES</small></div><div class="unit"><div class="num" id="secs">00</div><small>SECONDS</small></div></div><div class="launch"><span>STATUS: <b id="status">MASKED</b></span><span>RELEASE: <b>23 SEP 2026</b></span><span class="blink">█</span></div><footer><span>not a portfolio. a society.</span><span>access pending // <b>12 → 0</b></span></footer></div></section></main>
<script>
const release=new Date('2026-09-23T00:00:00+03:30').getTime(),pad=n=>String(Math.max(0,n)).padStart(2,'0');function tick(){const d=release-Date.now();if(d<=0){count.innerHTML='<div class="unit" style="grid-column:1/-1"><div class="num">ONLINE</div><small>LARPSOCIETY PUBLIC RELEASE</small></div>';status.textContent='ONLINE';document.title='LARPSOCIETY — ONLINE';return}days.textContent=Math.floor(d/86400000);hours.textContent=pad(Math.floor(d%86400000/3600000));mins.textContent=pad(Math.floor(d%3600000/60000));secs.textContent=pad(Math.floor(d%60000/1000))}tick();setInterval(tick,250);
const canvas=document.getElementById('network'),ctx=canvas.getContext('2d');let W,H,dpr,nodes=[],mouse={x:-9999,y:-9999},drag=null;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}function seed(){const c=Math.max(34,Math.min(72,Math.floor(W*H/19000)));nodes=Array.from({length:c},(_,i)=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()<.14?2.8:1.4,id:i}))}function pos(e){mouse.x=e.clientX;mouse.y=e.clientY}canvas.addEventListener('pointermove',e=>{pos(e);if(drag){drag.x=mouse.x;drag.y=mouse.y}});canvas.addEventListener('pointerdown',e=>{pos(e);let hit=null,best=18;for(const n of nodes){const d=Math.hypot(n.x-mouse.x,n.y-mouse.y);if(d<best){best=d;hit=n}}if(hit){drag=hit;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointerup',()=>{drag=null});canvas.addEventListener('pointerleave',()=>{if(!drag){mouse.x=-9999;mouse.y=-9999}});addEventListener('resize',()=>{resize();seed()});resize();seed();function frame(){ctx.clearRect(0,0,W,H);const maxDist=Math.min(190,W*.22);for(const n of nodes){if(n!==drag){n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1}const md=Math.hypot(n.x-mouse.x,n.y-mouse.y);if(md<150&&n!==drag){const f=(150-md)/150*.018;n.vx+=(n.x-mouse.x)*f;n.vy+=(n.y-mouse.y)*f}n.vx=Math.max(-.35,Math.min(.35,n.vx));n.vy=Math.max(-.35,Math.min(.35,n.vy))}for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<maxDist){ctx.strokeStyle='rgba(100,255,120,'+(1-d/maxDist)*.20+')';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}for(const n of nodes){const md=Math.hypot(n.x-mouse.x,n.y-mouse.y),hot=md<130;ctx.fillStyle=hot?'rgba(170,255,175,.95)':'rgba(100,220,115,.55)';ctx.beginPath();ctx.arc(n.x,n.y,n.r+(hot?1.5:0),0,Math.PI*2);ctx.fill()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
