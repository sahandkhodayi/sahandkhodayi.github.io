<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LARPSOCIETY — 12 DAYS</title>
<meta name="description" content="LARPSOCIETY is coming online.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#010302;color:#d9ffd9;font-family:"Courier New",monospace}body{overflow:hidden}.wall{position:fixed;inset:0;z-index:0;background:#020603}.wall img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.34;filter:brightness(.7) saturate(.7)}.wall img:first-child{object-position:center}.wall img:last-child{opacity:.16;mix-blend-mode:screen}.network{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:auto}.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 20%,rgba(0,0,0,.28) 58%,rgba(0,0,0,.78) 100%)}.noise,.scan{position:fixed;inset:0;z-index:4;pointer-events:none}.noise{opacity:.22;background:linear-gradient(90deg,rgba(0,255,80,.045) 1px,transparent 1px);background-size:5px 100%;mix-blend-mode:screen}.scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 5px);opacity:.38}.center{position:relative;z-index:3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;pointer-events:none}.terminal{width:min(650px,88vw);border:1px solid rgba(119,255,128,.32);background:rgba(1,6,3,.46);box-shadow:0 18px 80px rgba(0,0,0,.55),0 0 45px rgba(0,255,70,.07),inset 0 0 55px rgba(0,255,70,.025);backdrop-filter:blur(2px);pointer-events:auto}.head{height:30px;border-bottom:1px solid rgba(119,255,128,.18);display:flex;align-items:center;justify-content:space-between;padding:0 11px;font-size:8px;letter-spacing:.13em;color:#79aa7d}.dots{display:flex;gap:5px}.dots i{width:5px;height:5px;border-radius:50%;background:#356b3b}.body{padding:25px 30px 27px}.prompt{color:#69ff76;font-size:10px}.title{margin:14px 0 5px;font-size:clamp(38px,7vw,68px);line-height:.88;letter-spacing:.11em;color:#baffbf;text-shadow:0 0 22px rgba(91,255,108,.3);font-weight:700}.sub{color:#71b477;font-size:9px;letter-spacing:.16em}.rule{height:1px;background:rgba(119,255,128,.16);margin:21px 0}.label{font-size:8px;color:#68936c;letter-spacing:.18em}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.unit{border:1px solid rgba(119,255,128,.13);padding:11px 7px;background:rgba(0,20,4,.2);text-align:center}.num{font-size:clamp(24px,4vw,40px);color:#e0ffe1;line-height:1;text-shadow:0 0 12px rgba(150,255,160,.16)}.unit small{display:block;margin-top:5px;color:#5e9463;font-size:7px;letter-spacing:.15em}.launch{margin-top:18px;display:flex;justify-content:space-between;gap:12px;color:#67956b;font-size:8px;letter-spacing:.08em}.launch b{color:#a9ffaf;font-weight:400}.blink{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:.18}}footer{margin-top:16px;color:#426c47;font-size:7px;display:flex;justify-content:space-between;letter-spacing:.04em}@media(max-width:650px){.wall img:last-child{display:none}.body{padding:23px 18px}.terminal{width:94vw}.count{grid-template-columns:repeat(2,1fr)}.launch,footer{flex-wrap:wrap}.title{font-size:43px}}
</style>
</head>
<body>
<div class="wall" aria-hidden="true"><img src="media/countdown/photo-01.svg" alt=""><img src="media/countdown/photo-02.svg" alt=""></div>
<canvas class="network" id="network" aria-label="Interactive network background"></canvas><div class="vignette"></div><div class="noise"></div><div class="scan"></div>
<main class="center"><section class="terminal" aria-label="LARPSOCIETY release countdown">
<div class="head"><span class="dots"><i></i><i></i><i></i></span><span>LARPSOCIETY // PUBLIC NODE</span><span>BUILD 0.0.1</span></div>
<div class="body"><div><span class="prompt">larp@system:~$</span> ./release_countdown</div><h1 class="title">LARPSOCIETY</h1><div class="sub">THE SOCIETY IS COMING ONLINE</div><div class="rule"></div><div class="label">TIME UNTIL PUBLIC RELEASE</div><div class="count" id="count"><div class="unit"><div class="num" id="days">12</div><small>DAYS</small></div><div class="unit"><div class="num" id="hours">00</div><small>HOURS</small></div><div class="unit"><div class="num" id="mins">00</div><small>MINUTES</small></div><div class="unit"><div class="num" id="secs">00</div><small>SECONDS</small></div></div><div class="launch"><span>STATUS: <b id="status">MASKED</b></span><span>RELEASE: <b>23 SEP 2026</b></span><span class="blink">█</span></div><footer><span>not a portfolio. a society.</span><span>access pending // <b>12 → 0</b></span></footer></div></section></main>
<script>
const release=new Date('2026-09-23T00:00:00+03:30').getTime(),pad=n=>String(Math.max(0,n)).padStart(2,'0');
function tick(){const d=release-Date.now();if(d<=0){count.innerHTML='<div class="unit" style="grid-column:1/-1"><div class="num">ONLINE</div><small>LARPSOCIETY PUBLIC RELEASE</small></div>';status.textContent='ONLINE';document.title='LARPSOCIETY — ONLINE';return}days.textContent=Math.floor(d/86400000);hours.textContent=pad(Math.floor(d%86400000/3600000));mins.textContent=pad(Math.floor(d%3600000/60000));secs.textContent=pad(Math.floor(d%60000/1000))}tick();setInterval(tick,250);
const canvas=document.getElementById('network'),ctx=canvas.getContext('2d');let W,H,dpr,nodes=[],mouse={x:-9999,y:-9999},drag=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function seed(){const c=Math.max(28,Math.min(58,Math.floor(W*H/25000)));nodes=Array.from({length:c},(_,i)=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16,r:Math.random()<.15?2.7:1.25,id:i}))}
function pos(e){mouse.x=e.clientX;mouse.y=e.clientY}
canvas.addEventListener('pointermove',e=>{pos(e);if(drag){drag.x=mouse.x;drag.y=mouse.y;drag.vx=0;drag.vy=0}});
canvas.addEventListener('pointerdown',e=>{pos(e);let hit=null,best=20;for(const n of nodes){const d=Math.hypot(n.x-mouse.x,n.y-mouse.y);if(d<best){best=d;hit=n}}if(hit){drag=hit;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointerup',()=>{if(drag){drag.vx=(Math.random()-.5)*.16;drag.vy=(Math.random()-.5)*.16}drag=null});
canvas.addEventListener('pointerleave',()=>{if(!drag){mouse.x=-9999;mouse.y=-9999}});addEventListener('resize',()=>{resize();seed()});resize();seed();
function frame(){ctx.clearRect(0,0,W,H);const maxDist=Math.min(175,W*.19);for(const n of nodes){if(n!==drag){n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1}const md=Math.hypot(n.x-mouse.x,n.y-mouse.y);if(md<155&&n!==drag){const f=(155-md)/155*.014;n.vx+=(n.x-mouse.x)*f;n.vy+=(n.y-mouse.y)*f}n.vx=Math.max(-.3,Math.min(.3,n.vx));n.vy=Math.max(-.3,Math.min(.3,n.vy))}for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<maxDist){ctx.strokeStyle='rgba(100,255,120,'+(1-d/maxDist)*.24+')';ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}for(const n of nodes){const md=Math.hypot(n.x-mouse.x,n.y-mouse.y),hot=md<125;ctx.fillStyle=hot?'rgba(175,255,180,.98)':'rgba(100,220,115,.68)';ctx.beginPath();ctx.arc(n.x,n.y,n.r+(hot?1.4:0),0,Math.PI*2);ctx.fill();if(hot){ctx.strokeStyle='rgba(130,255,150,.24)';ctx.beginPath();ctx.arc(n.x,n.y,8+(125-md)*.05,0,Math.PI*2);ctx.stroke()}}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
