<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LARPSOCIETY — 12 DAYS</title>
<meta name="description" content="LARPSOCIETY is coming.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020403;color:#d9ffd9;font-family:"Courier New",monospace}body{overflow:hidden}.wall{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;filter:brightness(.34) saturate(.7)}.wall img{width:100%;height:100%;object-fit:cover;min-width:0}.wall img:first-child{object-position:center}.wall img:last-child{object-position:center}.noise,.scan{position:fixed;inset:0;pointer-events:none}.noise{background:radial-gradient(circle at 50% 50%,transparent 15%,rgba(0,0,0,.62) 100%),linear-gradient(90deg,rgba(0,255,80,.035) 1px,transparent 1px);background-size:auto,4px 100%;mix-blend-mode:screen}.scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);opacity:.55}.center{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.terminal{width:min(920px,94vw);border:1px solid rgba(119,255,128,.38);background:rgba(1,5,2,.78);box-shadow:0 0 60px rgba(0,255,70,.08),inset 0 0 80px rgba(0,255,70,.025);backdrop-filter:blur(5px)}.head{height:38px;border-bottom:1px solid rgba(119,255,128,.22);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;letter-spacing:.16em;color:#8dce91}.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#356b3b}.body{padding:42px 46px 48px}.prompt{color:#6dff79;font-size:13px}.title{margin:22px 0 8px;font-size:clamp(42px,8vw,92px);line-height:.9;letter-spacing:.08em;color:#a8ffad;text-shadow:0 0 18px rgba(91,255,108,.35);font-weight:700}.sub{color:#72b878;font-size:13px;letter-spacing:.14em}.rule{height:1px;background:rgba(119,255,128,.18);margin:30px 0}.label{font-size:11px;color:#6f9f73;letter-spacing:.18em}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.unit{border:1px solid rgba(119,255,128,.16);padding:17px 12px;background:rgba(0,20,4,.25)}.num{font-size:clamp(28px,5vw,55px);color:#d4ffd5;line-height:1}.unit small{display:block;margin-top:7px;color:#619b66;font-size:9px;letter-spacing:.16em}.launch{margin-top:30px;display:flex;justify-content:space-between;gap:20px;color:#6f9f73;font-size:10px;letter-spacing:.1em}.launch b{color:#a8ffad;font-weight:400}.blink{animation:blink 1.1s steps(2,end) infinite}@keyframes blink{50%{opacity:.25}}footer{margin-top:26px;color:#426a46;font-size:9px;display:flex;justify-content:space-between}.error{color:#ff9a9a}@media(max-width:650px){.wall{grid-template-columns:1fr}.wall img:last-child{display:none}.body{padding:30px 22px 32px}.count{grid-template-columns:repeat(2,1fr)}.launch,footer{flex-direction:column}.title{font-size:44px}.terminal{width:96vw}}
</style>
</head>
<body>
<div class="wall" aria-hidden="true"><img src="media/countdown/photo-01.svg" alt=""><img src="media/countdown/photo-02.svg" alt=""></div>
<div class="noise"></div><div class="scan"></div>
<main class="center"><section class="terminal" aria-label="LARPSOCIETY release countdown">
<div class="head"><span class="dots"><i></i><i></i><i></i></span><span>LARPSOCIETY // PUBLIC NODE</span><span>BUILD 0.0.1</span></div>
<div class="body">
<div><span class="prompt">larp@system:~$</span> ./release_countdown</div>
<h1 class="title">LARP<br>SOCIETY</h1>
<div class="sub">THE SOCIETY IS COMING ONLINE</div>
<div class="rule"></div>
<div class="label">TIME UNTIL PUBLIC RELEASE</div>
<div class="count" id="count"><div class="unit"><div class="num" id="days">12</div><small>DAYS</small></div><div class="unit"><div class="num" id="hours">00</div><small>HOURS</small></div><div class="unit"><div class="num" id="mins">00</div><small>MINUTES</small></div><div class="unit"><div class="num" id="secs">00</div><small>SECONDS</small></div></div>
<div class="launch"><span>STATUS: <b id="status">MASKED</b></span><span>RELEASE: <b>23 SEP 2026</b></span><span class="blink">█</span></div>
<footer><span>not a portfolio. a society.</span><span>access pending // <b>12 → 0</b></span></footer>
</div></section></main>
<script>
const release=new Date('2026-09-23T00:00:00+03:30').getTime();
const pad=n=>String(Math.max(0,n)).padStart(2,'0');
function tick(){const d=release-Date.now(),root=document.documentElement;if(d<=0){document.getElementById('count').innerHTML='<div class="unit" style="grid-column:1/-1"><div class="num">ONLINE</div><small>LARPSOCIETY PUBLIC RELEASE</small></div>';document.getElementById('status').textContent='ONLINE';document.title='LARPSOCIETY — ONLINE';return}document.getElementById('days').textContent=Math.floor(d/86400000);document.getElementById('hours').textContent=pad(Math.floor(d%86400000/3600000));document.getElementById('mins').textContent=pad(Math.floor(d%3600000/60000));document.getElementById('secs').textContent=pad(Math.floor(d%60000/1000))}tick();setInterval(tick,250);
</script>
</body>
</html>
