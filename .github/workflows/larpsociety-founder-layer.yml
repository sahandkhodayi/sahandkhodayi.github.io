name: LARPSOCIETY founder discovery layer

on:
  push:
    paths:
      - '.github/workflows/larpsociety-founder-layer.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace founder discovery layer
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          injection = r'''
<style id="larp-founder-style">
/* ============================================================
   LARPSOCIETY // FOUNDER DISCOVERY v2
   The founder should be impossible to miss.
   ============================================================ */
#larp-founder-layer{
  position:fixed;left:clamp(22px,6vw,92px);top:50%;z-index:30;
  width:min(430px,calc(100vw - 44px));
  transform:translateY(-42%) translateX(-22px);
  opacity:0;filter:blur(8px);
  pointer-events:none;
  font-family:"Courier New",monospace;
  color:#e8b57a;
  transition:opacity 1s ease,transform 1.15s cubic-bezier(.16,.7,.3,1),filter 1.15s ease;
}
#larp-founder-layer.found-visible{
  opacity:1;transform:translateY(-42%) translateX(0);filter:none;
}
.larp-founder-card{
  position:relative;padding:22px 24px 20px;
  border-left:2px solid #c98b4b;
  border-top:1px solid rgba(201,139,75,.38);
  border-right:1px solid rgba(201,139,75,.16);
  border-bottom:1px solid rgba(201,139,75,.16);
  background:linear-gradient(110deg,rgba(7,8,9,.92),rgba(7,8,9,.66),rgba(20,15,9,.34));
  box-shadow:0 24px 90px rgba(0,0,0,.72),0 0 45px rgba(201,139,75,.10),inset 18px 0 45px rgba(201,139,75,.025);
  backdrop-filter:blur(10px);
  overflow:hidden;
}
.larp-founder-card::before{
  content:"001";position:absolute;right:-12px;bottom:-34px;
  font-size:150px;font-weight:700;line-height:1;color:rgba(201,139,75,.045);
  letter-spacing:-.08em;pointer-events:none;
}
.larp-founder-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.018) 4px);
}
.larp-founder-top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:#806c57;
}
.larp-founder-label{color:#c98b4b;font-weight:700}
.larp-founder-status{display:flex;align-items:center;gap:7px;color:#b39a7d}
.larp-founder-status i{
  width:6px;height:6px;border-radius:50%;background:#c98b4b;
  box-shadow:0 0 12px rgba(201,139,75,.95);animation:larpFounderPulse 1.6s ease-in-out infinite;
}
@keyframes larpFounderPulse{50%{opacity:.25;transform:scale(.65)}}
.larp-founder-found{
  margin-top:18px;font-size:clamp(10px,1vw,13px);letter-spacing:.5em;
  color:#c98b4b;text-transform:uppercase;text-shadow:0 0 16px rgba(201,139,75,.35);
}
.larp-founder-name{
  position:relative;margin:5px 0 3px;
  font-size:clamp(27px,3.3vw,43px);line-height:1.02;
  font-weight:700;letter-spacing:.075em;color:#f0c893;
  text-shadow:0 0 20px rgba(201,139,75,.32),0 0 55px rgba(201,139,75,.12);
}
.larp-founder-sub{
  font-size:9px;letter-spacing:.25em;color:#8f765d;text-transform:uppercase;
}
.larp-founder-rule{
  height:1px;margin:18px 0 15px;
  background:linear-gradient(90deg,#c98b4b,rgba(201,139,75,.24),transparent);
}
.larp-founder-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:11px 25px;
  font-size:8px;letter-spacing:.16em;text-transform:uppercase;
}
.larp-founder-grid div{color:#62513f}
.larp-founder-grid b{display:block;margin-top:4px;color:#d0b28c;font-weight:400;letter-spacing:.12em}
.larp-founder-quote{
  margin-top:18px;color:#9a8065;font-size:9px;line-height:1.5;letter-spacing:.12em;
}
.larp-founder-quote::before{content:"> ";color:#c98b4b}
.larp-signal{
  position:fixed;left:50%;bottom:20px;z-index:31;transform:translateX(-50%);
  white-space:nowrap;color:rgba(201,139,75,.55);
  font:7px/1 "Courier New",monospace;letter-spacing:.32em;text-transform:uppercase;
  opacity:0;transition:opacity .7s ease;text-shadow:0 0 12px rgba(201,139,75,.2);
}
.larp-signal.visible{opacity:1}
.larp-founder-flash{
  position:fixed;inset:0;z-index:29;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 18% 50%,rgba(201,139,75,.16),transparent 35%);
}
.larp-founder-flash.fire{animation:larpFounderFlash .7s ease-out}
@keyframes larpFounderFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@media(max-width:800px){
  #larp-founder-layer{left:18px;right:18px;top:auto;bottom:62px;width:auto;transform:translateY(18px)}
  #larp-founder-layer.found-visible{transform:translateY(0)}
  .larp-founder-card{padding:16px 17px 15px}
  .larp-founder-name{font-size:25px}
  .larp-founder-found{margin-top:12px}
  .larp-founder-rule{margin:12px 0}
  .larp-founder-grid{gap:7px 15px;font-size:7px}
  .larp-founder-quote{margin-top:12px}
  .larp-signal{display:none}
}
@media(prefers-reduced-motion:reduce){
  #larp-founder-layer{transition:opacity .2s ease;transform:translateY(-42%)}
  #larp-founder-layer.found-visible{transform:translateY(-42%)}
  .larp-founder-status i{animation:none}
}
</style>

<div id="larp-founder-layer" aria-label="Founder discovered">
  <div class="larp-founder-card">
    <div class="larp-founder-top">
      <span class="larp-founder-label">// NODE DISCOVERY</span>
      <span class="larp-founder-status"><i></i>LOCKED</span>
    </div>
    <div class="larp-founder-found">FOUND</div>
    <div class="larp-founder-name">SAHAND KHODAIE</div>
    <div class="larp-founder-sub">NODE // 001 · FIRST SIGNAL · BUILDER</div>
    <div class="larp-founder-rule"></div>
    <div class="larp-founder-grid">
      <div>STATUS<b>ACTIVE</b></div>
      <div>ROLE<b>FOUNDER / BUILDER</b></div>
      <div>SIGNAL<b>CONFIRMED</b></div>
      <div>CLEARANCE<b>ROOT</b></div>
    </div>
    <div class="larp-founder-quote">he built the door.</div>
  </div>
</div>

<div id="larp-signal" class="larp-signal">TRANSMISSION // FOUNDER NODE 001 DISCOVERED</div>
<div id="larp-founder-flash" class="larp-founder-flash"></div>

<script id="larp-founder-script">
(function(){
  const founder=document.getElementById('larp-founder-layer');
  const signal=document.getElementById('larp-signal');
  const flash=document.getElementById('larp-founder-flash');
  if(!founder)return;

  const messages=[
    'TRANSMISSION // FOUNDER NODE 001 DISCOVERED',
    'SIGNAL // SAHAND KHODAIE // CONFIRMED',
    'NODE // 001 // BUILDER SIGNATURE LOCKED',
    'LARPSOCIETY // FIRST SIGNAL ACQUIRED'
  ];
  let i=0;

  function reveal(){
    founder.classList.add('found-visible');
    if(flash){flash.classList.remove('fire');void flash.offsetWidth;flash.classList.add('fire');}
    setTimeout(()=>signal&&signal.classList.add('visible'),500);
  }

  // Countdown gets the first beat. Then the founder is deliberately obvious.
  setTimeout(reveal,4200);

  setInterval(()=>{
    if(!signal)return;
    i=(i+1)%messages.length;
    signal.textContent=messages[i];
    signal.classList.remove('visible');
    setTimeout(()=>signal.classList.add('visible'),90);
  },4600);

  // Hidden local Easter egg: F toggles the founder node.
  window.addEventListener('keydown',e=>{
    if(e.key.toLowerCase()==='f'){
      founder.classList.toggle('found-visible');
      if(signal)signal.classList.toggle('visible');
    }
  });
})();
</script>
'''

          # Remove the previous generated founder layer, if one exists.
          html = re.sub(r'\n<style id="larp-founder-style">.*?<script id="larp-founder-script">.*?</script>\n', '\n', html, count=1, flags=re.S)
          html = re.sub(r'\n<div id="larp-founder-layer".*?</div>\n\s*<div id="larp-signal".*?</div>\n\s*<div id="larp-founder-flash".*?</div>\n', '\n', html, count=1, flags=re.S)

          marker = '</body>'
          if marker not in html:
              raise SystemExit('Could not find </body> in index.html')
          html = html.replace(marker, injection + '\n' + marker, 1)
          path.write_text(html, encoding='utf-8')
          print('Founder discovery v2 injected.')

      - name: Commit injected page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: make founder discovery unmistakable'
            git push
          fi
